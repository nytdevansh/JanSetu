<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page UI</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Top Blue Header -->
    <div class="header">
        <header class="top-header" id="top-header">
            <div class="top-header__inner">
                <div class="top-header__logos">
                    <img src="/Frontend/assets/ashok.png" alt="Government of India Emblem" class="top-header__logo">
                    <img src="/Frontend/assets/JanSetu.png" alt="JanSetu Logo" class="top-header__logo">
                </div>
                <div class="top-header__right">
                    <img src="/Frontend/assets/modiji.png" alt="Honourable Prime Minister" class="top-header__logo">
                </div>
            </div>
        </header>
    </div>

    <!-- Main Container -->
    <div class="container">

        <!-- Two Small Buttons -->
        <div class="row">
            <button class="rect small">Login</button>
            <button class="rect small">Register</button>
        </div>

        <!-- Input Fields -->
        <input type="text" placeholder="Username" class="rect large">
        <input type="password" placeholder="Password" class="rect large">

        <!-- Main Button -->
        <button class="rect medium">Submit</button>

        <!-- Bottom Text -->
        <p class="signup-text">
            DON'T HAVE A ACCOUNT? <a href="#">SIGN IN</a>
        </p>

    </div>

</body>

</html>
