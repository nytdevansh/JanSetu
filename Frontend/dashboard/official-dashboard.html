<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanSetu — Official Dashboard</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background-color: #0f172a;
            /* Slate 900 */
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        /* Top Navigation */
        .admin-nav {
            background-color: #1e293b;
            /* Slate 800 */
            border-bottom: 1px solid #334155;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            /* Sky 400 */
            letter-spacing: -0.5px;
        }

        .admin-badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .admin-info {
            text-align: right;
        }

        .admin-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #f1f5f9;
        }

        .admin-dept {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .logout-btn {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #334155;
            color: #f8fafc;
            border-color: #64748b;
        }

        /* Main Content area */
        .admin-main {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #f8fafc;
        }

        .page-desc {
            color: #94a3b8;
            margin: 0;
            font-size: 1rem;
        }

        /* Table Card */
        .table-card {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .complaint-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .complaint-table th {
            background: #0f172a;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
        }

        .complaint-table td {
            padding: 20px 24px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
            vertical-align: top;
        }

        .complaint-table tr:last-child td {
            border-bottom: none;
        }

        .complaint-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Typography & Badges */
        .tracking-id {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .citizen-name {
            font-weight: 500;
            color: #f1f5f9;
        }

        .complaint-title {
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 6px;
            font-size: 1rem;
        }

        .complaint-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-width: 350px;
        }

        .severity-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .severity-critical {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .severity-high {
            background: rgba(249, 115, 22, 0.15);
            color: #fdba74;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        .severity-medium {
            background: rgba(234, 179, 8, 0.15);
            color: #fde047;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .severity-low {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* Action Controls */
        .action-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-select {
            appearance: none;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 36px 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2394A3B8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
        }

        .status-select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        /* Dynamically colored selects based on class */
        .status-select.pending {
            border-color: #eab308;
            color: #fde047;
        }

        .status-select.approve {
            border-color: #22c55e;
            color: #86efac;
        }

        .status-select.reject {
            border-color: #ef4444;
            color: #fca5a5;
        }

        .btn-update {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(56, 189, 248, 0.2);
        }

        .btn-update:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }

        .btn-update:active {
            transform: translateY(0);
        }

        /* Loading / Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 3rem;
            color: #334155;
            margin-bottom: 16px;
        }

        /* ── Countdown Timer ── */
        .deadline-cell {
            white-space: nowrap;
            text-align: center;
        }

        .timer-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            letter-spacing: 0.5px;
            border: 1px solid;
            transition: background 0.5s, color 0.5s, border-color 0.5s;
        }

        .timer-badge.green {
            background: rgba(34, 197, 94, 0.12);
            color: #86efac;
            border-color: rgba(34, 197, 94, 0.35);
        }

        .timer-badge.yellow {
            background: rgba(234, 179, 8, 0.12);
            color: #fde047;
            border-color: rgba(234, 179, 8, 0.4);
        }

        .timer-badge.red {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.4);
            animation: pulse-red 1s ease-in-out infinite;
        }

        .timer-badge.expired {
            background: rgba(239, 68, 68, 0.08);
            color: #94a3b8;
            border-color: #334155;
            font-size: 0.75rem;
            animation: none;
        }

        @keyframes pulse-red {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.55;
            }
        }

        .timer-na {
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>

<body>

    <nav class="admin-nav">
        <div class="admin-brand">
            <div class="admin-logo">JanSetu</div>
            <div class="admin-badge">Official Portal</div>
        </div>
        <div class="admin-profile">
            <div class="admin-info">
                <div class="admin-name" id="official-name">Official Name</div>
                <div class="admin-dept" id="official-dept-region">Department • Region</div>
            </div>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
    </nav>

    <main class="admin-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Complaint Management</h1>
                <p class="page-desc">Review and update the status of citizen reports assigned to your jurisdiction.</p>
            </div>
            <div>
                <button class="logout-btn" onclick="loadComplaints()">↻ Refresh Table</button>
            </div>
        </div>

        <div class="table-card" id="table-container">
            <div class="empty-state">
                <div class="empty-icon">↻</div>
                <h3 style="color: #f8fafc; margin-bottom: 8px;">Loading complaints...</h3>
                <p style="color: #94a3b8; margin: 0;">Connecting to secure database.</p>
            </div>
        </div>
    </main>

    <script>
        const official = JSON.parse(sessionStorage.getItem('official'));

        if (!official) {
            window.location.href = '../login/official-login.html';
        } else {
            document.getElementById('official-name').textContent = official.full_name;
            document.getElementById('official-dept-region').textContent =
                `${official.department.replace('-', ' ').toUpperCase()} • ${official.region.toUpperCase()}`;
            loadComplaints();
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('official');
            window.location.href = '../index.html';
        });

        async function loadComplaints() {
            try {
                const res = await fetch(`/api/official/complaints?department=${official.department}&region=${official.region}`);
                const data = await res.json();

                if (!res.ok) throw new Error(data.error);

                renderTable(data.complaints);
            } catch (err) {
                document.getElementById('table-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon" style="color: #ef4444;">⚠️</div>
                        <h3 style="color: #f8fafc; margin-bottom: 8px;">Connection Failed</h3>
                        <p style="color: #fca5a5; margin: 0;">${err.message}</p>
                    </div>`;
            }
        }

        function renderTable(complaints) {
            if (!complaints || complaints.length === 0) {
                document.getElementById('table-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">✨</div>
                        <h3 style="color: #f8fafc; margin-bottom: 8px;">Inbox Zero</h3>
                        <p style="color: #94a3b8; margin: 0;">There are no assigned complaints in your queue.</p>
                    </div>`;
                return;
            }

            let html = `
                <table class="complaint-table">
                    <thead>
                        <tr>
                            <th>Tracking ID</th>
                            <th>Citizen</th>
                            <th>Issue Details</th>
                            <th>Severity</th>
                            <th>Filed On</th>
                            <th>⏱ Deadline</th>
                            <th>Status Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            complaints.forEach(c => {
                const date = new Date(c.created_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
                const trackingId = 'JAN-' + String(c.id).padStart(6, '0');

                // Determine severity badge class
                let sevClass = 'severity-low';
                if (c.level === 'critical') sevClass = 'severity-critical';
                if (c.level === 'high') sevClass = 'severity-high';
                if (c.level === 'medium') sevClass = 'severity-medium';

                // Timer cell — only shown for pending complaints
                let timerCell;
                if (c.status === 'pending') {
                    timerCell = `<td class="deadline-cell"><span class="timer-badge" id="timer-${c.id}" data-createdat="${c.created_at}">⏱ --:--</span></td>`;
                } else {
                    timerCell = `<td class="deadline-cell"><span class="timer-na">—</span></td>`;
                }

                html += `
                    <tr id="row-${c.id}">
                        <td><span class="tracking-id">${trackingId}</span></td>
                        <td><span class="citizen-name">${c.citizen_name}</span></td>
                        <td>
                            <div class="complaint-title">${c.title}</div>
                            <div class="complaint-desc">${c.description}</div>
                        </td>
                        <td>
                            <span class="severity-badge ${sevClass}">${c.level}</span>
                        </td>
                        <td style="white-space: nowrap;">${date}</td>
                        ${timerCell}
                        <td>
                            <div class="action-group">
                                <select id="status-${c.id}" class="status-select ${c.status}" onchange="this.className='status-select '+this.value">
                                    <option value="pending" ${c.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="approve" ${c.status === 'approve' ? 'selected' : ''}>Approve</option>
                                    <option value="reject" ${c.status === 'reject' ? 'selected' : ''}>Reject</option>
                                </select>
                                <button class="btn-update" onclick="updateStatus(${c.id}, event)">Update</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            document.getElementById('table-container').innerHTML = html;

            // Start countdown ticks for all pending rows
            startCountdownTickers();
        }

        // ── Countdown Ticker ──────────────────────────────────────
        const AUTO_REJECT_MS = 10 * 60 * 1000; // must match server AUTO_REJECT_MINUTES
        let tickerInterval = null;

        function startCountdownTickers() {
            // Clear any previous interval
            if (tickerInterval) clearInterval(tickerInterval);

            const badges = document.querySelectorAll('.timer-badge[data-createdat]');
            if (badges.length === 0) return;

            tickerInterval = setInterval(() => {
                let anyPending = false;

                badges.forEach(badge => {
                    const createdAt = new Date(badge.dataset.createdat).getTime();
                    const deadline = createdAt + AUTO_REJECT_MS;
                    const remaining = deadline - Date.now();
                    const id = badge.id.replace('timer-', '');

                    if (remaining <= 0) {
                        // Has expired — reload the table once
                        badge.textContent = '⛔ Expired';
                        badge.className = 'timer-badge expired';
                        clearInterval(tickerInterval);
                        tickerInterval = null;
                        setTimeout(() => loadComplaints(), 1200);
                        return;
                    }

                    anyPending = true;
                    const mins = String(Math.floor(remaining / 60000)).padStart(2, '0');
                    const secs = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
                    badge.textContent = `⏱ ${mins}:${secs}`;

                    // Colour coding
                    const pct = remaining / AUTO_REJECT_MS;
                    if (pct > 0.5) {
                        badge.className = 'timer-badge green';
                    } else if (pct > 0.2) {
                        badge.className = 'timer-badge yellow';
                    } else {
                        badge.className = 'timer-badge red';
                    }
                });

                if (!anyPending && tickerInterval) {
                    clearInterval(tickerInterval);
                    tickerInterval = null;
                }
            }, 1000);
        }

        async function updateStatus(id, event) {
            const status = document.getElementById(`status-${id}`).value;
            const btn = event.target;
            const originalText = btn.textContent;

            try {
                btn.textContent = 'Saving...';
                btn.disabled = true;

                const res = await fetch(`/api/official/complaint/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                if (!res.ok) throw new Error('Update failed');

                // Show success briefly
                btn.textContent = 'Saved ✓';
                btn.style.background = '#22c55e';
                btn.style.color = '#ffffff';

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                    btn.disabled = false;
                }, 2000);

            } catch (err) {
                alert(err.message);
                btn.textContent = 'Failed';
                btn.style.background = '#ef4444';
                btn.style.color = '#ffffff';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                    btn.disabled = false;
                }, 2000);
            }
        }
    </script>
</body>

</html>
